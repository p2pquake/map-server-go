# Cloud Run サービスの定義です。デプロイ手順は README.md を参照してください。
#   gcloud run services replace service.yaml --region asia-northeast1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: map-server-go
spec:
  template:
    metadata:
      annotations:
        # 未使用時はインスタンスを 0 にする (待機中は課金されない)
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # 起動中だけ CPU を増やしてコールドスタートを短くする
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # Google Cloud の API は使わないため、ロールを付与していない専用のサービスアカウントで動かす
      serviceAccountName: map-server-go@p2pquake.iam.gserviceaccount.com
      # 同時に届いたリクエストごとに新しいインスタンスを起動するとコールドスタートが増えるため、
      # 1 インスタンスで 4 リクエストまで同時に処理する (描画は 1 リクエストで 1 コアを使い切る)
      containerConcurrency: 4
      timeoutSeconds: 60
      containers:
        - image: IMAGE
          ports:
            - name: http1
              containerPort: 8080
          env:
            # 1GiB を超える前に GC を強める (JAPAN_4096 の全域描画で 1 リクエスト約 170MB)
            - name: GOMEMLIMIT
              value: 900MiB
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
          # 起動プローブは指定しない (既定の TCP プローブになり、ポートが開いた時点でリクエストを受ける)。
          # HTTP プローブは 1 回目が listen 前に失敗し、次の試行まで 1 秒待つためコールドスタートが遅くなる
