# Cloud Run サービスの定義です。デプロイ手順は README.md を参照してください。
#   gcloud run services replace service.yaml --region asia-northeast1
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: map-server-go
spec:
  template:
    metadata:
      annotations:
        # 未使用時はインスタンスを 0 にする (待機中は課金されない)
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # 起動中だけ CPU を増やしてコールドスタートを短くする
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      # Google Cloud の API は使わないため、ロールを付与していない専用のサービスアカウントで動かす
      serviceAccountName: map-server-go@p2pquake.iam.gserviceaccount.com
      # 描画は CPU を使い切るため、1 インスタンスで 1 リクエストずつ処理する
      containerConcurrency: 1
      timeoutSeconds: 60
      containers:
        - image: IMAGE
          ports:
            - name: http1
              containerPort: 8080
          env:
            # 512MiB を超える前に GC を強める (JAPAN_4096 の全域描画で約 170MB)
            - name: GOMEMLIMIT
              value: 450MiB
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /test
              port: 8080
            periodSeconds: 1
            failureThreshold: 10
            timeoutSeconds: 1
